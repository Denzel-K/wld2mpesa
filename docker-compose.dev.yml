# ── Development docker-compose ─────────────────────────────────────────────────
# Mounts source code from host → hot-reload for both services.
# Named volumes isolate node_modules from the host so platform differences
# (Linux vs macOS) don't corrupt the installed packages.
#
# Start:  docker compose -f docker-compose.dev.yml up
# Logs:   docker compose -f docker-compose.dev.yml logs -f
# Stop:   docker compose -f docker-compose.dev.yml down
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (Express + tsx watch) ──────────────────────────────────────────
  backend:
    image: node:22-alpine
    container_name: wld2mpesa-backend
    working_dir: /app
    # network_mode: host — uses the host machine's network stack directly.
    # This bypasses Docker's internal DNS stub (127.0.0.11) which fails to
    # resolve external domains like developer.world.org on many Linux setups.
    # Side-effects: `ports:` and `dns:` are not needed (ignored in host mode).
    network_mode: host
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npx tsx watch src/server.ts"
    environment:
      NODE_ENV: development
      DATABASE_URL: "file:/app/data/dev.db"
      PORT: "3001"
      CORS_ORIGIN: "*"
      # Add any other overrides here; secrets go in backend/.env
    env_file:
      - path: ./backend/.env
        required: false # Don't fail if .env doesn't exist yet
    volumes:
      - ./backend:/app # Live source mount
      - backend_modules:/app/node_modules # Isolated node_modules
      - db_data:/app/data # Persist SQLite DB in a dedicated folder
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── Frontend (Vite dev server) ──────────────────────────────────────────────
  frontend:
    image: node:22-alpine
    container_name: wld2mpesa-frontend
    working_dir: /app
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"
    environment:
      # Backend is on the host network — reach it via host's loopback
      VITE_PROXY_TARGET: http://localhost:3001
      VITE_WLD_APP_ID: app_ac9f43a974959b04b11b081c3740f932
      # Polling is required for file-watching inside Docker bind mounts on Linux
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    env_file:
      - path: ./frontend/.env.local
        required: false
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    # ports: not needed — host network mode exposes port 3000 directly
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  backend_modules:
  frontend_modules:
  db_data:
