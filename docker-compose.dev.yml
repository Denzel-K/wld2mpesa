# ── Development docker-compose ─────────────────────────────────────────────────
# Mounts source code from host → hot-reload for both services.
# Named volumes isolate node_modules from the host so platform differences
# (Linux vs macOS) don't corrupt the installed packages.
#
# Start:  docker compose -f docker-compose.dev.yml up
# Logs:   docker compose -f docker-compose.dev.yml logs -f
# Stop:   docker compose -f docker-compose.dev.yml down
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (Express + tsx watch) ──────────────────────────────────────────
  backend:
    image: node:22-alpine
    container_name: wld2mpesa-backend
    working_dir: /app
    ports:
      - "3001:3001"
    command: sh -c "npm install && npx prisma generate && npx prisma migrate dev --name init && npx tsx watch src/server.ts"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wld2mpesa?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "3001"
      CORS_ORIGIN: "*"
      # Add any other overrides here; secrets go in backend/.env
    env_file:
      - path: ./backend/.env
        required: false # Don't fail if .env doesn't exist yet
    volumes:
      - ./backend:/app # Live source mount
      - backend_modules:/app/node_modules # Isolated node_modules
      - backend_generated:/app/.generated # Isolated Prisma generated files
    depends_on:
      - db
      - redis
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  db:
    image: postgres:15-alpine
    container_name: wld2mpesa-postgres-dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wld2mpesa
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    container_name: wld2mpesa-redis-dev
    ports:
      - "6380:6379"
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── Frontend (Vite dev server) ──────────────────────────────────────────────
  frontend:
    image: node:22-alpine
    container_name: wld2mpesa-frontend
    working_dir: /app
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      # Backend is on host network — reach via host.docker.internal
      VITE_PROXY_TARGET: http://backend:3001
      VITE_WLD_APP_ID: app_ac9f43a974959b04b11b081c3740f932
      # Polling is required for file-watching inside Docker bind mounts on Linux
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    env_file:
      - path: ./frontend/.env.local
        required: false
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  backend_modules:
  backend_generated:
  frontend_modules:
  postgres_data_dev:
  redis_data_dev:
